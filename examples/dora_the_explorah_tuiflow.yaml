app_title: dora the explorah
controls:
  selection_up:
    name: selection up
    key: !Char 'k'
  selection_down:
    name: selection down
    key: !Char 'j'
  quit:
    name: quit
    key: !Char 'q'
  custom_controls:
    moveback:
      name: move back
      key: !Char 'h'
    moveinto:
      name: move into
      key: !Char 'l'
initial_command: ls -d -1 --file-type "$PWD/"*
initial_state: show_files
initial_cli_output_variable_set_extractor: ((?<base>\/[^\r\n]*){0,1}(?<wd>\/[^\/\n\r]*)\/|(?<root>\/))(?<target>((?<subdir>[^\/\n\r]+\/)|(?<file>[^\/\n\r]+)))
states:
  show_files:
    line_display_pattern: <subfolder>/<file>
    transitions:
      - control_name: moveinto
        cli_output_variable_set_extractor: ((?<base>\/[^\r\n]*){0,1}(?<wd>\/[^\/\n\r]*)\/|(?<root>\/))(?<target>((?<subdir>[^\/\n\r]+\/)|(?<file>[^\/\n\r]+)))
        command_pattern: ls -d -1 "<base>/<wd>/<subdir>/"*
        next_state: show_files
      - control_name: moveinto
        cli_output_variable_set_extractor: ((?<base>\/[^\r\n]*){0,1}(?<wd>\/[^\/\n\r]*)\/|(?<root>\/))(?<target>((?<subdir>[^\/\n\r]+\/)|(?<file>[^\/\n\r]+)))
        command_pattern: ls -d -1 "<path>/<wd>/"*
        next_state: show_files
      - control_name: moveback
        cli_output_variable_set_extractor: ((?<base>\/[^\r\n]*){0,1}(?<wd>\/[^\/\n\r]*)\/|(?<root>\/))(?<target>((?<subdir>[^\/\n\r]+\/)|(?<file>[^\/\n\r]+)))
        command_pattern: ls -d -1 "<path>/"*
        next_state: show_files